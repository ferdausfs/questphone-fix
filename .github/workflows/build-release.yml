name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_API_KEY=${SUPABASE_API_KEY}
          API_URL=${API_URL}
          EOF
        env:
          # These endpoint values are public-by-design (they ship inside every
          # distributed APK). Override with repo secrets if you run your own backend.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hplszhlnchhfwngbojnc.supabase.co' }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY || 'sb_publishable_zzdik6KGZp6yP9ZGvuqkkA' }}
          API_URL: ${{ secrets.API_URL || 'https://api.questphone.app' }}

      - name: Decode release keystore (optional)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "No keystore secret found — release APK will be signed with the debug key (installable, for testing)."
          fi

      - name: Build Play release APK
        run: ./gradlew :app:assemblePlayRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*release*.apk" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: questphone-apk
          path: dist/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
